name: Release Go Binary

on:
  workflow_call:
    inputs:
      goreleaser-config:
        description: Path to GoReleaser config file
        type: string
        default: .goreleaser.yaml
      go-version-file:
        description: Path to go.mod or go.work for Go version resolution
        type: string
        default: go.mod
      workdir:
        description: Working directory containing the Go module (monorepo subdirectory); goreleaser-config resolves relative to it
        type: string
        default: '.'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: false

      - uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: latest
          workdir: ${{ inputs.workdir }}
          args: release --clean --config ${{ inputs.goreleaser-config }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
