name: Release Helm Chart

on:
  workflow_call:
    inputs:
      charts-dir:
        description: Directory containing chart subdirectories (e.g. helm-charts or charts)
        type: string
        required: true
      pages-url:
        description: GitHub Pages base URL for Helm repo index (e.g. https://jdwlabs.github.io/platform)
        type: string
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Parse tag
        id: tag
        run: |
          TAG="${{ github.ref_name }}"
          COMPONENT=$(echo "$TAG" | sed 's/-v[0-9].*//')
          VERSION=$(echo "$TAG" | sed "s/${COMPONENT}-v//")
          echo "component=$COMPONENT" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - uses: azure/setup-helm@v5.0.0

      - name: Package chart
        run: |
          mkdir -p .cr-release-packages
          # --dependency-update: without it, helm package silently packages a chart
          # whose declared dependencies (e.g. file://-referenced library charts) are
          # missing from charts/, producing a tgz that fails only at install time
          helm package ${{ inputs.charts-dir }}/${{ steps.tag.outputs.component }} \
            --dependency-update \
            --version ${{ steps.tag.outputs.version }} \
            --destination .cr-release-packages/

      - name: Find previous tag for changelog scope
        id: prev_tag
        run: |
          COMPONENT="${{ steps.tag.outputs.component }}"
          CURRENT="${{ github.ref_name }}"
          PREV=$(git tag --list "${COMPONENT}-v*" --sort=-version:refname \
            | grep -v "^${CURRENT}$" | head -1 || true)
          echo "tag=${PREV}" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHART="${{ steps.tag.outputs.component }}"
          VERSION="${{ steps.tag.outputs.version }}"
          TAG="${{ github.ref_name }}"
          PREV="${{ steps.prev_tag.outputs.tag }}"
          TGZ=$(ls .cr-release-packages/*.tgz)

          if [ -n "$PREV" ]; then
            gh release create "$TAG" \
              --title "${CHART} v${VERSION}" \
              --generate-notes \
              --notes-start-tag "$PREV" \
              "$TGZ"
          else
            gh release create "$TAG" \
              --title "${CHART} v${VERSION}" \
              --generate-notes \
              "$TGZ"
          fi

      - name: Update Helm repo index on gh-pages
        run: |
          git fetch origin gh-pages
          git worktree add gh-pages-dir origin/gh-pages
          cp .cr-release-packages/*.tgz gh-pages-dir/
          helm repo index gh-pages-dir/ \
            --url ${{ inputs.pages-url }} \
            --merge gh-pages-dir/index.yaml
          cd gh-pages-dir
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "chore: update Helm repo index for ${{ github.ref_name }}"
          git push origin HEAD:gh-pages
