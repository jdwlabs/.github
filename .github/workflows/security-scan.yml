name: Security Scan

on:
  workflow_call:
    inputs:
      scan-path:
        description: Path to scan (repo-relative)
        type: string
        default: '.'
      severity:
        description: Comma-separated severities that fail the job
        type: string
        default: 'CRITICAL,HIGH'
      fail-on-findings:
        description: Fail the job when findings at or above `severity` exist. SARIF still uploads either way.
        type: boolean
        default: false
      config-ref:
        description: jdwlabs/.github ref to fetch gitleaks.toml from when the runner does not expose the reusable workflow's own SHA
        type: string
        default: main

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6.0.3

      # Trivy in filesystem mode covers SCA (lockfiles: go.mod, package.json,
      # gradle), IaC misconfig (Terraform, Helm, Kubernetes manifests),
      # Dockerfile misconfig, and secrets in one pass. This job is advisory by
      # default (fail-on-findings gates it); the blocking secrets gate is the
      # gitleaks job below, and GitHub's native secret-scanning/push-protection
      # (on for public repos) remains the push-time defense.
      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.scan-path }}
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy-results.sarif
          severity: ${{ inputs.severity }}
          exit-code: ${{ inputs.fail-on-findings && '1' || '0' }}

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # Blocking secrets gate: any leak fails the job, unlike the advisory Trivy
  # job above. Rules and the value-pinned allowlist live in this repo's
  # gitleaks.toml so the config is maintained in exactly one place.
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository under scan
        uses: actions/checkout@v6.0.3
        with:
          path: repo

      # Fetch the org config at the exact ref this reusable workflow is
      # running from (job_workflow_sha), so workflow and config cannot drift
      # apart. The runner leaves job_workflow_sha empty for branch-referenced
      # reusable workflows, so fall back to config-ref (default: main, where
      # both this workflow and gitleaks.toml live in lockstep).
      - name: Checkout org gitleaks config
        uses: actions/checkout@v6.0.3
        with:
          repository: jdwlabs/.github
          ref: ${{ github.job_workflow_sha || inputs.config-ref }}
          path: org-config

      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      # --verbose itemizes each finding (file/line/rule) so a blocked PR is
      # actionable from the log alone; --redact keeps the secret itself out.
      - name: Run gitleaks (blocking)
        run: |
          gitleaks dir repo \
            --config org-config/gitleaks.toml \
            --redact \
            --verbose \
            --no-banner \
            --exit-code 1
          echo "gitleaks: 0 leaks found — secrets gate passed"
