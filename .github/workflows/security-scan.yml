name: Security Scan

on:
  workflow_call:
    inputs:
      scan-path:
        description: Path to scan (repo-relative)
        type: string
        default: '.'
      severity:
        description: Comma-separated severities that fail the job
        type: string
        default: 'CRITICAL,HIGH'
      fail-on-findings:
        description: Fail the job when findings at or above `severity` exist. SARIF still uploads either way.
        type: boolean
        default: false
      config-ref:
        description: jdwlabs/.github ref to fetch gitleaks.toml from. Pass the ref you pinned this workflow to, otherwise pinned workflow logic runs against main's config.
        type: string
        default: main
      max-binary-bytes:
        description: Largest binary file a pull request may add, in bytes. Raise it deliberately in the calling repo if an asset genuinely belongs in git.
        type: number
        default: 1048576

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6.0.3

      # Trivy in filesystem mode covers SCA (lockfiles: go.mod, package.json,
      # gradle), IaC misconfig (Terraform, Helm, Kubernetes manifests),
      # Dockerfile misconfig, and secrets in one pass. This job is advisory by
      # default (fail-on-findings gates it); the blocking secrets gate is the
      # gitleaks job below, and GitHub's native secret-scanning/push-protection
      # (on for public repos) remains the push-time defense.
      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.scan-path }}
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy-results.sarif
          severity: ${{ inputs.severity }}
          exit-code: ${{ inputs.fail-on-findings && '1' || '0' }}

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # Blocking secrets gate: any leak fails the job, unlike the advisory Trivy
  # job above. Rules and the value-pinned allowlist live in this repo's
  # gitleaks.toml so the config is maintained in exactly one place.
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository under scan
        uses: actions/checkout@v6.0.3
        with:
          path: repo

      # A reusable workflow cannot discover its own ref: the github context
      # exposes workflow_sha/workflow_ref, and both describe the *caller*.
      # job_workflow_sha exists only as an OIDC token claim, not as a context
      # property, so reading it here yielded the empty string and silently took
      # the fallback on every run — the drift this once claimed to prevent was
      # never actually prevented.
      #
      # The config ref is therefore an explicit input, defaulting to main where
      # this workflow and gitleaks.toml live in lockstep. A caller that pins the
      # workflow to a non-main ref must pass that same ref as config-ref, or it
      # runs new workflow logic against main's config.
      - name: Checkout org gitleaks config
        uses: actions/checkout@v6.0.3
        with:
          repository: jdwlabs/.github
          ref: ${{ inputs.config-ref }}
          path: org-config

      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      # --verbose itemizes each finding (file/line/rule) so a blocked PR is
      # actionable from the log alone; --redact keeps the secret itself out.
      - name: Run gitleaks (blocking)
        run: |
          gitleaks dir repo \
            --config org-config/gitleaks.toml \
            --redact \
            --verbose \
            --no-banner \
            --exit-code 1
          echo "gitleaks: 0 leaks found — secrets gate passed"

  # Blocking size gate on binaries a pull request *adds*. A build artifact
  # committed by accident stays in history forever once merged: the working
  # tree can be cleaned in a follow-up commit, but every clone still pays for
  # the blob, and rebase-merging preserves the commit that introduced it.
  # A 10MB Windows binary reached main this way, cleaned one commit later and
  # still costing 5.6MB packed in perpetuity — .gitignore alone did not catch
  # it, because the file was added before the ignore rule existed.
  #
  # Scoped to added files so the gate can be introduced without rewriting any
  # existing content, and to pull requests because it needs a base to diff
  # against.
  binaries:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository under scan
        uses: actions/checkout@v6.0.3
        with:
          # Both endpoints of the comparison must be present locally; the
          # default shallow clone does not reach the base commit.
          fetch-depth: 0

      - name: Reject oversized binaries added by this pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAX_BYTES: ${{ inputs.max-binary-bytes }}
        run: |
          set -euo pipefail

          # Walk every commit in the range rather than diffing base against
          # head. These repos merge by rebase, so each commit lands on main
          # individually: a branch that adds a blob and deletes it again in a
          # later commit has a clean net diff while still carrying the blob
          # into history permanently. That is precisely how the incident above
          # happened, and a net-diff check does not see it.
          #
          # git reports "-" for both add and delete counts on files it treats
          # as binary. That is a content test, not an extension list, so a
          # renamed .exe or an unfamiliar format is caught just the same.
          violations=0
          binaries_added=0

          # Every git call is checked explicitly and any failure exits
          # non-zero. A blocking gate that inspected nothing yet reported a
          # pass is worse than no gate, and the range genuinely can become
          # unresolvable — a base branch rewritten between the pull_request
          # event and this job leaves the base commit unreachable. Reading the
          # walk from a process substitution would hide exactly that failure
          # from both `set -e` and `pipefail`.
          if ! commits=$(git rev-list "${BASE_SHA}".."${HEAD_SHA}"); then
            echo "::error::Cannot resolve ${BASE_SHA}..${HEAD_SHA} — refusing to report a pass without inspecting the range."
            exit 1
          fi

          # NUL-terminated records keep paths verbatim. The default C-quoting
          # of non-ASCII and control characters would reach cat-file as literal
          # quotes and backslashes and abort the step, blocking a pull request
          # that added a perfectly small, legitimate file.
          numstat=$(mktemp)
          trap 'rm -f "${numstat}"' EXIT

          while read -r sha; do
            [ -n "${sha}" ] || continue
            if ! git diff-tree --no-commit-id --numstat -z --diff-filter=A -r "${sha}" >"${numstat}"; then
              echo "::error::Cannot diff ${sha} — refusing to report a pass without inspecting it."
              exit 1
            fi
            while IFS=$'\t' read -r -d '' added deleted path; do
              [ "${added}" = "-" ] && [ "${deleted}" = "-" ] || continue
              binaries_added=$((binaries_added + 1))
              if ! size=$(git cat-file -s "${sha}:${path}"); then
                echo "::error::Cannot size ${path} in ${sha} — refusing to report a pass without inspecting it."
                exit 1
              fi
              if [ "${size}" -gt "${MAX_BYTES}" ]; then
                printf '  %s — %s bytes (limit %s), added in %s\n' \
                  "${path}" "${size}" "${MAX_BYTES}" "${sha:0:9}"
                violations=$((violations + 1))
              fi
            done <"${numstat}"
          done <<<"${commits}"

          if [ "${violations}" -gt 0 ]; then
            echo
            echo "::error::${violations} oversized binary file(s) added — see the list above."
            echo "Deleting the file in a later commit does not clear this: these repos"
            echo "rebase-merge, so the commit that added it still lands on main and the"
            echo "blob stays in history for every clone. Rewrite the branch so the file"
            echo "is never added, and add the path to .gitignore. If the file genuinely"
            echo "belongs in git, raise max-binary-bytes in this repo's caller."
            exit 1
          fi

          echo "binary size gate: 0 oversized binaries added — passed (limit ${MAX_BYTES} bytes, ${binaries_added} binary file(s) added across the range)"
