name: Release Container Image

on:
  workflow_call:
    inputs:
      component:
        description: Component name matching the image name and Nx project
        type: string
        required: true
      registry:
        description: Container registry hostname
        type: string
        default: ghcr.io
      image-repo:
        description: Image repository path under the registry (e.g. jdwlabs)
        type: string
        required: true
      dockerfile:
        description: Path to the Dockerfile
        type: string
        default: Dockerfile
      context:
        description: Docker build context path
        type: string
        default: .
      platforms:
        description: Target platforms for multi-arch build
        type: string
        default: linux/amd64,linux/arm64

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Parse tag
        id: tag
        run: |
          TAG="${{ github.ref_name }}"
          COMPONENT="${{ inputs.component }}"
          # Handle both component-v1.2.3 (new) and component-1.2.3 (legacy) formats
          if echo "$TAG" | grep -qP "^${COMPONENT}-v[0-9]"; then
            VERSION=$(echo "$TAG" | sed "s/${COMPONENT}-v//")
          else
            VERSION=$(echo "$TAG" | sed "s/${COMPONENT}-//")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v4.1.0

      - uses: docker/login-action@v4.2.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7.2.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: |
            ${{ inputs.registry }}/${{ inputs.image-repo }}/${{ inputs.component }}:${{ steps.tag.outputs.version }}
            ${{ inputs.registry }}/${{ inputs.image-repo }}/${{ inputs.component }}:latest

      - name: Find previous tag for changelog scope
        id: prev_tag
        run: |
          COMPONENT="${{ inputs.component }}"
          CURRENT="${{ github.ref_name }}"
          PREV=$(git tag --list "${COMPONENT}-v*" "${COMPONENT}-[0-9]*" \
            --sort=-version:refname \
            | grep -v "^${CURRENT}$" | head -1 || true)
          echo "tag=${PREV}" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMPONENT="${{ inputs.component }}"
          VERSION="${{ steps.tag.outputs.version }}"
          TAG="${{ github.ref_name }}"
          PREV="${{ steps.prev_tag.outputs.tag }}"

          if [ -n "$PREV" ]; then
            gh release create "$TAG" \
              --title "${COMPONENT} v${VERSION}" \
              --generate-notes \
              --notes-start-tag "$PREV"
          else
            gh release create "$TAG" \
              --title "${COMPONENT} v${VERSION}" \
              --generate-notes
          fi
